<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="Desafio das Estrelas - Sistema de tokens para rotina matinal">
    <title>Desafio das Estrelas</title>
    
    <!-- Google Fonts - Plus Jakarta Sans & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css?v=5.0">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="manifest" href="manifest.json">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-display: swap;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Kid Zone -->
        <main id="kid-zone">
            <header>
                <h1>Desafio das Estrelas <span id="version-badge" class="version-badge">v1.0.0</span></h1>
                <p id="greeting">Bom dia!</p>
            </header>

            <section id="punch-section">
                <button id="punch-btn" aria-label="Carimbar chegada">
                    <span class="punch-star-icon" aria-hidden="true">★</span>
                    <span id="punch-text">CARIMBAR!</span>
                </button>
                <p id="feedback" class="hidden"></p>
            </section>

            <section id="stats">
                <div id="estrela-counter" class="stat-card">
                    <span class="stat-icon">★</span>
                    <span class="stat-label">Estrelas</span>
                    <span id="total-estrelas" class="stat-value">0</span>
                </div>
                <div id="streak-counter" class="stat-card">
                    <span class="stat-icon">🔥</span>
                    <span class="stat-label">Sequência</span>
                    <span id="current-streak" class="stat-value">0</span>
                </div>
            </section>

            <section id="rewards-shop">
                <h2>Loja de Prémios</h2>
                <div id="rewards-list" class="rewards-grid"></div>
            </section>

            <section id="history">
                <h2>Últimos Dias</h2>
                <table id="days-table">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Hora</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>
                    <tbody id="history-body"></tbody>
                </table>
            </section>
        </main>

        <!-- Parent Zone (hidden by default) -->
        <aside id="parent-zone" class="hidden">
            <button id="close-parent" class="close-btn">✕ Fechar</button>
            <section id="settings">
                <h2>Definições</h2>
                <div class="form-group">
                    <label for="deadline-input">Hora Limite:</label>
                    <input type="time" id="deadline-input" value="08:00">
                    <button id="save-deadline">Guardar</button>
                </div>
            </section>
            <section id="admin-rewards">
                <h2>Gerir Prémios</h2>
                <div id="reward-editor">
                    <div class="form-group">
                        <input type="text" id="reward-name" placeholder="Nome do prémio">
                        <input type="number" id="reward-cost" placeholder="Custo em estrelas" min="1">
                        <button id="add-reward">Adicionar</button>
                    </div>
                    <ul id="reward-list-admin"></ul>
                </div>
            </section>
            <section id="admin-tools">
                <h2>Ferramentas</h2>
                <div class="form-group">
                    <label for="manual-time">Hora manual:</label>
                    <input type="time" id="manual-time">
                    <button id="manual-punch">Registar</button>
                </div>
                <button id="clear-today" class="danger-btn">Limpar Hoje</button>
                <button id="reset-all" class="danger-btn">Reiniciar Tudo</button>
            </section>
            <section id="redemption-log">
                <h2>Registro de Troca</h2>
                <ul id="log-list"></ul>
            </section>
        </aside>

        <div id="admin-hint" class="admin-hint">Pressiona e mantém para menu de pais</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
